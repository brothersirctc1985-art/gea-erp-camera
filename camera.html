<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gurukul ERP Camera</title>
<style>
body{font-family:Arial,sans-serif;background:#f1f5f9;margin:0;padding:18px;color:#0f172a}
.card{max-width:520px;margin:0 auto;background:white;border-radius:12px;padding:18px;box-shadow:0 4px 18px #0002}
h2{margin:0 0 12px;color:#1e3a8a}
video{width:100%;max-height:62vh;background:#111;border-radius:8px;object-fit:cover}
button{border:0;border-radius:7px;padding:12px 18px;color:white;font-weight:bold;margin:8px 6px 0 0;font-size:15px}
#capture{background:#15803d}#cancel{background:#b91c1c}
#status{font-size:14px;color:#475569;min-height:24px}
</style>
</head>
<body>
<main class="card">
<h2>GURUKUL ENGLISH ACADEMY</h2>
<p>Camera capture — allow camera access when Chrome asks.</p>
<video id="video" autoplay playsinline muted></video>
<p id="status">Starting camera…</p>
<button id="capture" disabled>Capture Photo</button>
<button id="cancel">Cancel</button>
</main>
<script>
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(err => console.warn('Offline camera cache registration failed:', err));
  });
}
const params=new URLSearchParams(location.search);
const nonce=params.get('nonce')||'';
const video=document.getElementById('video');
const statusEl=document.getElementById('status');
let stream=null;
function send(type,extra={}) {
  if(window.opener&&!window.opener.closed) window.opener.postMessage({type,nonce,...extra},'*');
}
async function start() {
  try {
    if(!window.isSecureContext||!navigator.mediaDevices?.getUserMedia)
      throw new Error('This page must be opened from HTTPS in a supported browser.');
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});
    video.srcObject=stream;
    await video.play();
    document.getElementById('capture').disabled=false;
    statusEl.textContent='Camera ready.';
  } catch(e) {
    statusEl.textContent=(e.name||'Error')+': '+(e.message||'Camera permission denied');
    send('GEA_CAMERA_ERROR',{message:statusEl.textContent});
  }
}
document.getElementById('capture').addEventListener('click',()=>{
  if(!video.videoWidth){statusEl.textContent='Camera is not ready yet.';return;}
  const maxW=1280,scale=Math.min(1,maxW/video.videoWidth);
  const c=document.createElement('canvas');
  c.width=Math.round(video.videoWidth*scale);
  c.height=Math.round(video.videoHeight*scale);
  c.getContext('2d').drawImage(video,0,0,c.width,c.height);
  send('GEA_CAMERA_CAPTURE',{dataUrl:c.toDataURL('image/jpeg',0.82)});
  statusEl.textContent='Photo sent to ERP. You can close this tab.';
  if(stream)stream.getTracks().forEach(t=>t.stop());
  setTimeout(()=>window.close(),500);
});
document.getElementById('cancel').addEventListener('click',()=>{
  send('GEA_CAMERA_CANCEL');
  if(stream)stream.getTracks().forEach(t=>t.stop());
  window.close();
});
window.addEventListener('beforeunload',()=>{
  if(stream)stream.getTracks().forEach(t=>t.stop());
});
start();
</script>
</body>
</html>
